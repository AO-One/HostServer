<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />

    <link rel="manifest" href="/aibusinessapp/assets/manifest-BZeGP1N8.json" />
    <title>Base44 APP</title>
    
    <script>
      async function sendBusinessAppLog(actionType, details) {
          const dataToSave = {
              timestamp: new Date().toISOString(),
              app_name: "AIBusinessApp",
              action: actionType,
              details: details
          };

          try {
              const response = await fetch('http://localhost:9000/write-record', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ table: 'business_app_logs', data: dataToSave })
              });
              const result = await response.json();
              console.log("[AIBusinessApp] OneDatabase Response:", result.message);
          } catch (error) {
              console.error("[AIBusinessApp] Failed to stream log:", error);
          }
      }

      // Automatically send an initial startup log to test the connection on launch
      window.addEventListener('DOMContentLoaded', () => {
          sendBusinessAppLog("APP_LAUNCH", "AIBusinessApp session initialized successfully.");
      });
    </script>
