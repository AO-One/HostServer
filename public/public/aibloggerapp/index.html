    <title>Base44 APP</title>
	<script>
  async function sendBloggerAppLog(actionType, details) {
      const dataToSave = {
          timestamp: new Date().toISOString(),
          app_name: "AIBloggerApp",
          action: actionType,
          details: details
      };

      try {
          const response = await fetch('http://localhost:9000/write-record', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ table: 'blogger_app_logs', data: dataToSave })
          });
          const result = await response.json();
          console.log("[AIBloggerApp] OneDatabase Response:", result.message);
      } catch (error) {
          console.error("[AIBloggerApp] Failed to stream log:", error);
      }
  }

  // Auto-send launch log on page load
  window.addEventListener('DOMContentLoaded', () => {
      sendBloggerAppLog("APP_LAUNCH", "AIBloggerApp session initialized successfully.");
  });
</script>
